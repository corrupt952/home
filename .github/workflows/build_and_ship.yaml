name: Build and Ship

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build_and_ship.yaml
      - containers/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: set-matrix
        run: |
          matrix=$(jq -ncR '[inputs]' <<< $(ls containers))
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build_and_ship:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: set-matrix
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        container: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "containers/${{ matrix.container }}"
          push: true
          tags: |-
            ghcr.io/corrupt952/home/${{ matrix.container }}:${{ github.sha }},
            ghcr.io/corrupt952/home/${{ matrix.container }}:latest
